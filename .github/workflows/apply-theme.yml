name: Apply visual theme
on:
  push:
    paths:
      - 'theme.css'
      - '.github/workflows/apply-theme.yml'
permissions:
  contents: write
jobs:
  theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link theme and polish capitalization
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          if 'theme.css' not in s: s=s.replace('</head>','<link rel="stylesheet" href="/theme.css"></head>')
          s=s.replace('Evidence for the decision','Evidence for the Decision').replace('Recommended next move','Recommended Next Move').replace('General product guidance','General Product Guidance').replace('Advanced strategic analysis','Advanced Strategic Analysis').replace('Analyze experiment','Analyze Experiment')
          p.write_text(s)
          PY
      - name: Commit theme link
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || (git commit -m "Apply polished visual theme" && git push)

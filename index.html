<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A/B Test Decision Engine</title><style>body{font-family:Inter,system-ui;background:#f6f7fb;color:#172033;margin:0}.w{max-width:1100px;margin:auto;padding:32px 20px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.m{background:#f8fafc;padding:16px;border-radius:12px}label{display:block;margin:10px 0 4px;font-size:13px;font-weight:700}input{padding:10px;width:100%;box-sizing:border-box;border:1px solid #d0d5dd;border-radius:9px}.decision{border:2px solid;padding:15px;border-radius:12px}.bars{display:flex;align-items:flex-end;height:220px;gap:60px;justify-content:center}.bar{width:100px;background:#172033;border-radius:8px 8px 0 0}.btn{padding:11px 15px;border:0;border-radius:9px;background:#172033;color:white;font-weight:700;cursor:pointer}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="w"><h1>📊 A/B Test Analyzer & AI Decision Copilot</h1><p>Translate experimental metrics into actionable product deployment decisions.</p><div class="card"><h2>Experiment setup</h2><div class="grid"><div><label>Control sample size</label><input id="nc" type="number" value="1200"><label>Control conversion rate</label><input id="pc" type="number" step="0.01" value="0.10"></div><div><label>Variant sample size</label><input id="nv" type="number" value="1250"><label>Variant conversion rate</label><input id="pv" type="number" step="0.01" value="0.13"></div><div><label>Significance level α</label><input id="alpha" type="number" step="0.01" value="0.05"><label>Minimum sample size / variant</label><input id="minn" type="number" value="1000"></div></div><button class="btn" onclick="run()">Analyze experiment</button></div><div class="grid"><div class="m"><small>Control Rate</small><h2 id="cr"></h2></div><div class="m"><small>Variant Rate</small><h2 id="vr"></h2></div><div class="m"><small>Relative Lift</small><h2 id="lift"></h2></div></div><div class="card"><h2>📝 Product Decision Memo</h2><div class="decision" id="decision"></div></div><div class="grid"><div class="card"><h2>Conversion Rate Comparison</h2><div class="bars"><div><div class="bar" id="bc"></div><center>Control</center></div><div><div class="bar" id="bv"></div><center>Variant</center></div></div></div><div class="card" style="grid-column:span 2"><h2>Diagnostics</h2><div id="diag"></div></div></div><div class="card"><h2>🤖 Product Manager Copilot</h2><button class="btn" onclick="copilot()">Generate Strategic Next Steps</button><div id="ai"></div></div></div><script>function erf(x){let s=x<0?-1:1;x=Math.abs(x);let a1=.254829592,a2=-.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=.3275911,t=1/(1+p*x),y=1-(((((a5*t+a4)*t+a3)*t+a2)*t+a1)*t)*Math.exp(-x*x);return s*y}function run(){let n1=+nc.value,n2=+nv.value,p1=+pc.value,p2=+pv.value,a=+alpha.value,m=+minn.value;let x1=n1*p1,x2=n2*p2,p=(x1+x2)/(n1+n2),se=Math.sqrt(p*(1-p)*(1/n1+1/n2)),z=se?(p2-p1)/se:0,pval=2*(1-(.5*(1+erf(Math.abs(z)/Math.sqrt(2))))),l=p1?(p2-p1)/p1:0;cr.textContent=(p1*100).toFixed(2)+'%';vr.textContent=(p2*100).toFixed(2)+'%';lift.textContent=(l>=0?'+':'')+(l*100).toFixed(2)+'%';let d,r,c;if(n1<m||n2<m){d='INCONCLUSIVE: Low Sample Size';r='Do not ship yet. Sample size is below the required threshold.';c='orange'}else if(pval<a&&l>0){d='SHIP IT: Statistically Significant Positive Lift';r=`Variant outperformed control with ${(l*100).toFixed(2)}% relative lift (p=${pval.toFixed(4)}).`;c='green'}else if(pval<a&&l<0){d='KILL IT: Statistically Significant Negative Impact';r=`Variant degraded the metric by ${(l*100).toFixed(2)}% (p=${pval.toFixed(4)}).`;c='red'}else{d='DO NOT SHIP: No Significant Difference';r=`Observed difference is not statistically significant (p=${pval.toFixed(4)} ≥ α=${a}).`;c='gray'}decision.style.borderColor=c;decision.innerHTML=`<h3 style="color:${c}">${d}</h3><p>${r}</p>`;bc.style.height=(p1/Math.max(p1,p2,.01)*180)+'px';bv.style.height=(p2/Math.max(p1,p2,.01)*180)+'px';diag.innerHTML=`<p>Control sample: <b>${n1.toLocaleString()}</b></p><p>Variant sample: <b>${n2.toLocaleString()}</b></p><p>z-score: <b>${z.toFixed(3)}</b></p><p>p-value: <b>${pval.toFixed(4)}</b></p><p>Significant? <b>${pval<a?'Yes':'No'}</b></p>`;window.last={d,l,pval}}function copilot(){run();let ship=last.d.includes('SHIP IT');ai.innerHTML=ship?'<ul><li><b>Phased rollout:</b> Increase exposure while monitoring guardrails.</li><li><b>Segment deep-dive:</b> Find cohorts driving the lift.</li><li><b>Follow-up test:</b> Isolate why the variant succeeded.</li></ul>':'<ul><li><b>User research:</b> Investigate friction behind the result.</li><li><b>Behavioral segmentation:</b> Check whether specific cohorts differ.</li><li><b>Alternative hypothesis:</b> Iterate before production rollout.</li></ul>'}run()</script></body></html>
